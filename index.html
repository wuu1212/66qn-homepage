  /* ===== 设计令牌 ===== */
  :root {
    --bg: #FAFAFA;

    --border: #E5E5E5;

    --radius-full: 999px;

    --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.10);
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --sp-6: 32px;

  /* 视觉方向：明亮极简。刻意不跟随系统深色模式，

  /* ===== 基础 ===== */
  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

    padding: 0 var(--sp-5) var(--sp-8);

    line-height: 1.6;

  .container {

    max-width: var(--container);
    margin: 0 auto;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: var(--radius-sm);
  }

  /* ===== Hero 首屏 ===== */
  .hero {
    padding: var(--sp-8) 0 var(--sp-7);
    text-align: center;
  }

  .avatar {

    height: 120px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border);
    background: var(--surface);
    object-fit: cover;
    display: block;
    margin: 0 auto var(--sp-5);
    box-shadow: var(--shadow-md);
  }

  .hero__name {

    line-height: 1.25;

  .hero__role {

    color: var(--text-muted);
  }

  .hero__subtitle {
    margin: 0;
    font-size: 15px;
    color: var(--text-muted);
  }

  /* ===== 链接区 ===== */
  .links {
    padding-bottom: var(--sp-8);
  }

  .links__title {
    margin: 0 0 var(--sp-5);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
  }

  .links__grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: var(--sp-4);
    /* 移动端优先：单列 */
    grid-template-columns: 1fr;
  }

  .card {
    display: flex;
    align-items: flex-start;
    gap: var(--sp-4);
    padding: var(--sp-5);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    color: inherit;
    transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent);
  }

  .card__icon {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .card__icon svg {
    width: 20px;
    height: 20px;
    display: block;
  }

  .card__body { display: block; min-width: 0; }

  .card__name {
    display: block;
    margin: 0 0 var(--sp-1);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .card__desc {

    margin: 0;
    font-size: 14px;
    color: var(--text-muted);
    overflow-wrap: anywhere;
  }

  /* ===== 页脚 ===== */

    padding-top: var(--sp-5);
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);

  /* ===== 响应式 ===== */

  @media (min-width: 768px) {

    .avatar { width: 132px; height: 132px; }
    .hero__name { font-size: 34px; }
  }

  @media (min-width: 1000px) {

  @media (max-width: 480px) {

  /* ===== 动效降级 ===== */
  @media (prefers-reduced-motion: reduce) {

      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;

</style>
